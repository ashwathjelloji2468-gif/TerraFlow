# M6 loss-estimation defaults (docs/impact_outputs.md §5 "Loss estimation").
# Every value below is a fact: {value, unit, source, status[, note]}, same shape as
# sites/*.yaml's SourcedValue (CLAUDE.md rule 3). status: placeholder values load, but
# every loss_inr computed from them must set has_placeholders: true.

loss:
  # Huizinga, de Moel & Szewczyk (2017), Global flood depth-damage functions:
  # methodology and the database with guidelines. JRC EUR 28552 EN. doi:10.2760/16510.
  # docs/data_sources.md src_031 (damage functions) / src_032 (max damage values).
  jrc_source_damage_curves: src_031
  jrc_source_asset_values: src_032
  jrc_region: ASIA
  jrc_country: India

  # Top of the JRC tabulated depth range (m); damage_fraction is 1.0 above this.
  depth_cap_m: 6.0

  eur_to_inr_2010:
    value: 60.6683
    unit: INR/EUR
    source: src_047
    status: sourced
    note: >
      RBI Handbook of Statistics on Indian Economy, Table 139, calendar-year 2010 annual
      average. Applied first (docs/decisions.md 2026-09-25 'JRC loss estimation'). Verify
      against RBI's primary PDF before treating as final (docs/data_sources.md src_047 caveat
      — read via a secondary source because rbi.org.in is CAPTCHA-gated).

  price_index_2010_to_current:
    value: 2.171
    unit: "-"
    source: src_050
    status: sourced
    note: >
      WPI All Commodities: Dec 2010 = 144.1 (base 2004-05=100) -> 76.94 (base 2011-12=100, via
      the official 1.873 linking factor) -> current = 167.0 (Apr 2026, base 2011-12=100) ->
      167.0 / 76.94 = 2.171. Applied second, in INR, after the FX conversion. Apr 2026 is used
      as "current" (not the latest month) because WPI's base was mid-revision to 2022-23=100
      with no reliable 2011-12->2022-23 linking factor available — see docs/data_sources.md
      src_050 caveats. Re-derive once that linking factor is published.

  default_road_width_m:
    value: 3.75
    unit: m
    source: src_051
    status: sourced
    note: >
      IRC:73 single-lane carriageway width, the IRC category closest to the
      residential/unclassified/track roads dominating OSM coverage here. Applied to every OSM
      highway=* kind uniformly — IRC:73 widths are per road category (NH/SH/MDR/ODR/VR), not
      per OSM tag, and per-class widths are not yet implemented (docs/impact_outputs.md §6).

  # OSM building=* tag value -> JRC building damage class. Unmapped values (including
  # building=yes, normalised to 'building' by exposure_osm.py) fall back to
  # default_building_class and are counted in the loss output's assumptions.
  default_building_class: residential
  osm_building_to_jrc:
    house: residential
    residential: residential
    apartments: residential
    detached: residential
    terrace: residential
    semidetached_house: residential
    dormitory: residential
    bungalow: residential
    commercial: commercial
    retail: commercial
    office: commercial
    hotel: commercial
    kiosk: commercial
    industrial: industrial
    warehouse: industrial

  # NOTE: facilities.gpkg (hospitals, schools, bridges) and agriculture are not
  # included in loss_inr. facilities.gpkg holds points, not footprint polygons, so
  # there is no area to apply a per-m2 damage value to without inventing one
  # (CLAUDE.md rule 3); exposure/ also has no cropland layer for agriculture. Both
  # are named in loss_inr.assumptions so this scope limit is never silent.

# M6 impact product settings (docs/impact_outputs.md header block; Feature 9). Read by
# backend/m6_impact/impact.py and backend/m6_impact/exports.py -- no copy of these lives in code.
impact:
  depth_classes_m: [0.1, 0.3, 1.0, 2.0, 5.0]           # class lower edges; below the first = not shown
  depth_class_labels: [wet, low, moderate, high, extreme]
  arrival_bands_min: [15, 30, 60, 120, 180, 360]      # last band is "> 360"
  arrival_percentile: 10                              # early arrival used for isochrones
  detection_delay_min: 10                             # lead time after detection = arrival - this
  zone_high_p: 0.5                                    # p_inundation >= this -> HIGH
  zone_possible_p: 0.1                                # >= this and < high -> POSSIBLE
  population_sig_figs: 2
  population_floor: 50                                # counts below this are shown as "< 50"
  # D x V hazard edges (m^2/s). docs/impact_outputs.md §1.1 marks them "VERIFY and cite a source";
  # no source is held, so no D·V layer is produced while status is unverified.
  dv_hazard_m2s:
    value: [0.5, 1.0, 3.0]
    status: unverified
    source: null
