# =============================================================================
# sites/<site_id>.yaml  —  GLOF / dam-break site configuration  (schema v1)
# Copy to sites/<site_id>.yaml and fill every field.
# =============================================================================
#
# FIELD OBJECT — every data value is written like this:
#
#   some_key:
#     value:  number | [number, ...] | string | null
#     unit:   string
#     source: string
#     status: sourced | placeholder
#     note:   string                  # optional
#
#   value   A number, or a fixed-length numeric array whose parts share one source:
#             point -> [lon, lat]
#             bbox  -> [min_lon, min_lat, max_lon, max_lat]
#           Coordinates: WGS 84 (EPSG:4326), decimal degrees, GeoJSON order
#           (longitude first). Enums and datetimes are strings.
#           null is allowed only while status is placeholder.
#   unit    m | m^3 | deg | epsg | enum (categorical) | iso8601 (date/datetime)
#   source  sourced     -> full citation: document or dataset, version,
#                          page/table, DOI or URL.
#           placeholder -> where the real value is expected to come from.
#   status  sourced | placeholder (nothing else).
#
# Keys that are NOT wrapped are identifiers and labels only:
#   id, name, region, river, kind, category, description, from, triggered_by.
# =============================================================================

schema_version: 1

site:
  id: <site_id>                    # lowercase snake_case; must equal the file name
  name: <Site name>
  region: <State, district(s)>
  river: <River system>
  # country_iso3: <ISO 3166-1 alpha-3, e.g. IND>   # optional (Feature 16); selects the national WorldPop
  #                                                 # raster. Never inferred from region/bbox; omit if unknown.

crs:
  utm_epsg:                        # projected CRS for all model grids (WGS 84 / UTM zone nnN -> 326nn)
    value: null
    unit: epsg
    source: ""
    status: placeholder

# -----------------------------------------------------------------------------
# Model domains
#   far_field  - coarse grid, from the most upstream breach to the downstream limit
#   near_field - fine grid around the assets that need detailed inundation
# -----------------------------------------------------------------------------
domains:
  far_field:
    description: <extent and purpose>
    bbox:
      value: null                  # [min_lon, min_lat, max_lon, max_lat]
      unit: deg
      source: ""
      status: placeholder
    grid_resolution:
      value: null
      unit: m
      source: ""
      status: placeholder
    inflow:                        # where the upstream hydrograph enters this domain
      from: <dam_id>               # a dam id (its breach hydrograph) or far_field (routed output)
      location:
        value: null                # [lon, lat], on the channel centreline
        unit: deg
        source: ""
        status: placeholder
      base_flow:                   # optional; steady discharge already in the channel before t0
        value: null                # M3 initial channel flow before the breach hydrograph starts
        unit: m^3/s
        source: ""
        status: placeholder

  near_field:
    description: <extent and purpose>
    bbox:
      value: null                  # [min_lon, min_lat, max_lon, max_lat]; must sit inside far_field
      unit: deg
      source: ""
      status: placeholder
    grid_resolution:
      value: null
      unit: m
      source: ""
      status: placeholder
    inflow:
      from: far_field              # a dam id or far_field
      location:
        value: null                # [lon, lat], on the near-field boundary
        unit: deg
        source: ""
        status: placeholder

# -----------------------------------------------------------------------------
# Dams / lakes - one entry per structure that can breach, upstream -> downstream.
# triggered_by: id of the upstream dam whose flood causes this breach (cascade), else null.
# A site with any triggered_by needs a top-level cascade: block (below).
#
# breach_inputs feed the empirical breach relations (e.g. Froehlich 2008/2016,
# Xu & Zhang 2009). Confirm the enum codes against your breach module's
# coefficient tables. Expect breach_height <= dam_height.
#
# equations_applicable: false (required for kind: concrete_dam - the equations are not
# recommended for concrete dams, docs/Equations.md §7) reports imposed_ranges instead of
# computing breach_inputs through the equations; breach_inputs is still required by the
# schema below but is only used for the hydrograph shape, not for the breach parameter ranges.
#
# trigger: only on a dam with triggered_by set. Under cascade.approach: two_stage_imposed
# this dam's own breach hydrograph starts when routed inflow from its upstream dam first
# reaches trigger.value (m^3/s) - see docs/decisions.md, "M2 cascade engine".
# -----------------------------------------------------------------------------
dams:
  - id: <dam_id>
    name: <Dam or lake name>
    kind: <moraine_dammed_lake | embankment_dam | concrete_dam | landslide_dam>
    triggered_by: null
    # trigger:                     # only if triggered_by is set
    #   type: inflow_threshold
    #   value: {value: null, unit: m^3/s, source: "", status: placeholder}
    equations_applicable: true     # false -> concrete_dam, or any dam using imposed ranges
    # imposed_ranges:               # required if equations_applicable: false
    #   peak_discharge_m3s: {value: null, unit: m^3/s, source: "", status: placeholder}  # [low, high]
    #   breach_width_m:     {value: null, unit: m,     source: "", status: placeholder}  # [low, high]
    #   failure_time_s:     {value: null, unit: s,     source: "", status: placeholder}  # [low, high]
    location:                      # dam crest centre
      value: null                  # [lon, lat]
      unit: deg
      source: ""
      status: placeholder
    breach_location:               # breach centreline; breach hydrograph is applied here
      value: null                  # [lon, lat]
      unit: deg
      source: ""
      status: placeholder
    breach_inputs:
      water_volume_above_invert:   # V_w - stored volume above the breach invert at failure
        value: null
        unit: m^3
        source: ""
        status: placeholder
      water_height_above_invert:   # h_w - water surface at failure minus breach invert
        value: null
        unit: m
        source: ""
        status: placeholder
      breach_height:               # h_b - dam crest minus breach invert
        value: null
        unit: m
        source: ""
        status: placeholder
      dam_height:                  # h_d - crest above downstream toe / streambed
        value: null
        unit: m
        source: ""
        status: placeholder
      average_embankment_width:    # W_avg - (crest width + base width) / 2
        value: null
        unit: m
        source: ""
        status: placeholder
      dam_type:                    # HD homogeneous | CD core-wall | FD concrete-faced | ZD zoned-fill
        value: null
        unit: enum
        source: ""
        status: placeholder
      failure_mode:                # O overtopping | P piping
        value: null
        unit: enum
        source: ""
        status: placeholder
      erodibility:                 # H high | M medium | L low
        value: null
        unit: enum
        source: ""
        status: placeholder

    # -------------------------------------------------------------------------
    # volume_elevation - optional. Storage above the final breach invert, used by
    # the breach_growth_weir hydrograph method (backend/m2_breach/storage.py,
    # hydrograph.py). Without it, the hydrograph falls back to the triangular
    # method. Two ways to give it, pick one:
    #   surveyed_curve       - points: [[elevation_m, volume_m3], ...] (>= 2,
    #                           strictly increasing), plus breach_invert_elevation_m.
    #   area_volume_relation - V = a * A^b; only the exponent b (> 1) is needed
    #                           here (a is fit from breach_inputs at run time).
    # -------------------------------------------------------------------------
    # volume_elevation:
    #   method: area_volume_relation       # surveyed_curve | area_volume_relation
    #   breach_invert_elevation_m:         # required if method: surveyed_curve
    #     value: null
    #     unit: m
    #     source: ""
    #     status: placeholder
    #   points:                            # required if method: surveyed_curve
    #     value: null                      # [[elevation_m, volume_m3], ...]
    #     unit: m^3
    #     source: ""
    #     status: placeholder
    #   area_volume_exponent_b:            # required if method: area_volume_relation
    #     value: null
    #     unit: "-"
    #     source: ""
    #     status: placeholder

    # -------------------------------------------------------------------------
    # initial_water_level - optional. Water level (m) at t0, for a reservoir that
    # sits inside the Delft3D domain (contract §3.1, §3.3 emulator_inputs).
    # -------------------------------------------------------------------------
    # initial_water_level:
    #   value: null
    #   unit: m
    #   source: ""
    #   status: placeholder

# -----------------------------------------------------------------------------
# Cascade - only present if any dam above has triggered_by set.
# approach: two_stage_imposed (M2-implemented: a downstream dam's hydrograph is triggered by
#   routed upstream inflow crossing its own trigger.value, see the dams block above) or
#   dambreak_structure (dynamic breaching inside a Delft3D structure - M3's job, not M2's).
# -----------------------------------------------------------------------------
# cascade:
#   approach: two_stage_imposed

# -----------------------------------------------------------------------------
# Points of interest - reported on in outputs (arrival time, peak depth, ...)
# category: village | dam | bridge | hospital
# -----------------------------------------------------------------------------
points_of_interest:
  - id: <poi_id>
    name: <Name>
    category: <village | dam | bridge | hospital>
    location:
      value: null                  # [lon, lat]
      unit: deg
      source: ""
      status: placeholder

# -----------------------------------------------------------------------------
# Events - historical (for validation) or hypothetical (scenarios).
# Datetimes are ISO 8601 with UTC offset, e.g. "2023-10-03T23:00:00+05:30".
# Imagery fields are plain dates, e.g. "2023-09-28".
# -----------------------------------------------------------------------------
events:
  - id: <event_id>
    name: <Event name>
    kind: <historical | hypothetical>
    onset:                         # first release (outburst / first breach)
      value: null
      unit: iso8601
      source: ""
      status: placeholder
    breach_times:                  # one key per dam id that fails in this event
      <dam_id>:
        value: null
        unit: iso8601
        source: ""
        status: placeholder
    simulation_start:
      value: null
      unit: iso8601
      source: ""
      status: placeholder
    simulation_end:
      value: null
      unit: iso8601
      source: ""
      status: placeholder
    imagery_pre_event:             # satellite scene date used for validation
      value: null
      unit: iso8601
      source: ""
      status: placeholder
    imagery_post_event:
      value: null
      unit: iso8601
      source: ""
      status: placeholder

# -----------------------------------------------------------------------------
# Simulation — which scenarios also get a near-field DualSPHysics (M4) run
# (docs/handoff_contract.md §4.4: simulation.sph.scenarios). scenario_ids must
# start with "<site_id>__" and match the docs/decisions.md naming scheme
# (s<NNN> | demo_s<NNN> | hist_<event_id> | n_<slug>). Solver settings are NOT
# here — they stay in config/m4_sph.yaml, not per-site.
# -----------------------------------------------------------------------------
simulation:
  sph:
    scenarios: []
